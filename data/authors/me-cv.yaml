# CV timeline, rendered by the `resume-experience` block on the homepage.
#
# Education and experience live here rather than in me.yaml on purpose:
# resume-biography-3 renders `education` automatically from whichever
# profile it is given, so keeping it in me.yaml made UCLA appear twice.
# Splitting it means the biography block shows identity only, and this
# block owns the timeline.
